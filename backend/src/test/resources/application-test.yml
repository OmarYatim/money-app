spring:
  mail:
    host: localhost
    port: 2525
    username: test
    password: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false   # H2 handles schema creation via ddl-auto — skip Flyway in tests

app:
  frontend-url: http://localhost:4200
  cors-allowed-origins: http://localhost:4200
  mail:
    from: no-reply@test.nexioo.local

management:
  health:
    mail:
      enabled: false
