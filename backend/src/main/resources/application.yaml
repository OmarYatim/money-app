spring:
  application:
    name: backend
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  frontend-url: ${APP_FRONTEND_URL}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  mail:
    from: ${APP_MAIL_FROM:no-reply@localhost}
  sync:
    cron: ${APP_SYNC_CRON:0 0 2 * * *}
    freshness-threshold-hours: ${APP_SYNC_FRESHNESS_THRESHOLD_HOURS:12}

server:
  port: 8080

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

powens:
  domain: ${POWENS_DOMAIN}
  client-id: ${POWENS_CLIENT_ID}
  client-secret: ${POWENS_CLIENT_SECRET}
  manage-token: ${POWENS_MANAGE_TOKEN}
  redirect-url: ${POWENS_REDIRECT_URL}
