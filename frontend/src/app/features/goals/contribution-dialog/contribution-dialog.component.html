<form class="contribution-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="contribution-form__header">
    <h2>Add contribution</h2>
    <button class="contribution-form__icon" type="button" aria-label="Close contribution form" (click)="formClosed.emit()">
      <span class="material-icons">close</span>
    </button>
  </div>

  <label class="contribution-form__field">
    <span>Amount</span>
    <input formControlName="amount" type="number" min="0.01" step="0.01" placeholder="150" />
  </label>

  <label class="contribution-form__field">
    <span>Date</span>
    <input formControlName="contributedAt" type="date" />
  </label>

  <label class="contribution-form__field">
    <span>Note</span>
    <input formControlName="note" type="text" placeholder="Birthday money" />
  </label>

  @if (form.invalid && form.touched) {
    <p class="contribution-form__error">A positive contribution amount is required.</p>
  }

  <div class="contribution-form__actions">
    <button class="contribution-form__secondary" type="button" (click)="formClosed.emit()">Cancel</button>
    <button class="contribution-form__primary" type="submit" [disabled]="saving()">Add</button>
  </div>
</form>
