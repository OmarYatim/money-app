<form class="contribution-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="contribution-form__header">
    <h2>{{ 'goals.addContribution' | translate }}</h2>
    <button class="contribution-form__icon" type="button" [attr.aria-label]="'goals.closeContributionForm' | translate" (click)="formClosed.emit()">
      <span class="material-icons">close</span>
    </button>
  </div>

  <label class="contribution-form__field">
    <span>{{ 'goals.amount' | translate }}</span>
    <input formControlName="amount" type="number" min="0.01" step="0.01" placeholder="150" />
  </label>

  <label class="contribution-form__field">
    <span>{{ 'transactions.filters.date' | translate }}</span>
    <input formControlName="contributedAt" type="date" />
  </label>

  <label class="contribution-form__field">
    <span>{{ 'goals.form.note' | translate }}</span>
    <input formControlName="note" type="text" [placeholder]="'goals.contributionNotePlaceholder' | translate" />
  </label>

  @if (form.invalid && form.touched) {
    <p class="contribution-form__error">{{ 'goals.contributionAmountRequired' | translate }}</p>
  }

  <div class="contribution-form__actions">
    <button class="contribution-form__secondary" type="button" (click)="formClosed.emit()">{{ 'common.cancel' | translate }}</button>
    <button class="contribution-form__primary" type="submit" [disabled]="saving()">{{ 'common.add' | translate }}</button>
  </div>
</form>
