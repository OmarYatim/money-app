<form class="goal-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="goal-form__header">
    <h2>{{ heading() }}</h2>
    <button class="goal-form__icon" type="button" aria-label="Close form" (click)="formClosed.emit()">
      <span class="material-icons">close</span>
    </button>
  </div>

  <label class="goal-form__field">
    <span>Name</span>
    <input formControlName="name" type="text" placeholder="Emergency fund" />
  </label>

  <label class="goal-form__field">
    <span>Target amount</span>
    <input formControlName="targetAmount" type="number" min="0.01" step="0.01" placeholder="3000" />
  </label>

  <label class="goal-form__field">
    <span>Target date</span>
    <input formControlName="targetDate" type="date" />
  </label>

  <label class="goal-form__field">
    <span>Linked account</span>
    <select formControlName="linkedAccountId">
      <option [ngValue]="null">Manual contributions</option>
      @for (account of accounts(); track account.id) {
        <option [ngValue]="account.id">{{ account.name }}</option>
      }
    </select>
  </label>

  @if (form.invalid && form.touched) {
    <p class="goal-form__error">Name and a positive target amount are required.</p>
  }

  <div class="goal-form__actions">
    <button class="goal-form__secondary" type="button" (click)="formClosed.emit()">Cancel</button>
    <button class="goal-form__primary" type="submit" [disabled]="saving()">{{ submitLabel() }}</button>
  </div>
</form>
