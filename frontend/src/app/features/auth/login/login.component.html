<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6 text-center">{{ title() }}</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1"
          >Password</label
        >
        <input
          id="password"
          type="password"
          formControlName="password"
          [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-red-600" role="alert">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="!isFormValid() || loading()"
        class="w-full bg-indigo-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-indigo-700 disabled:opacity-50 transition-colors"
      >
        {{ submitLabel() }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      {{ togglePrompt() }}
      <button
        type="button"
        (click)="toggleMode()"
        class="text-indigo-600 hover:underline font-medium ml-1"
      >
        {{ toggleLabel() }}
      </button>
    </p>
  </div>
</div>
