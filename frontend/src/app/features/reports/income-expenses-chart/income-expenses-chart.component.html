@if (data().length === 0) {
  <div class="chart-empty">{{ 'reports.noCashFlowData' | translate }}</div>
} @else {
  <div class="chart-frame">
    <canvas
      baseChart
      type="bar"
      [data]="chartData()"
      [options]="chartOptions"
      [attr.aria-label]="'reports.incomeVersusSpendingChart' | translate"
    ></canvas>
  </div>
}
